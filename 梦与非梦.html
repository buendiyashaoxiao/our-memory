<script>
(function(){
const S0 = {scene:"title", facts:[], archive:[], lens:"huang", tab:null, y77:false, talked:false, seen:[]};
let st = Object.assign({}, S0, (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.st) || {});

try{ dreamCount = parseInt(localStorage.getItem("mfm-dreams")||"1",10)||1 }catch(e){}

const has = f => st.facts.includes(f);

/* ---------- glossary ---------- */
const GLOSS = {
  yufeng:{m:["裕丰纱厂"],t:"裕丰纱厂",b:"日本商人在上海杨树浦开办的纱厂。1945年抗战胜利后收归国有，改为中国纺织建设公司第十七棉纺织厂，也就是后来的国棉十七厂，上海最大的三家纺织厂之一。"},
  cui:{m:["崔根娣"],t:"崔根娣",b:"王洪文的妻子，国棉十七厂工人。文革后她评价王洪文“爱管闲事”。1976年10月，王洪文曾托秘书向她提出离婚以免牵连家人，她表示只要孩子给她就答应，但手续未办完王洪文就被捕了。"},
  nie:{m:["聂元梓"],t:"聂元梓（1921—2019）",b:"北京大学哲学系党总支书记。1966年5月25日与另外六人在北大贴出大字报，点名批判北大党委书记陆平等人。毛泽东下令向全国广播，此举点燃了全国范围的造反。聂后来成为北京红卫兵“五大领袖”之一，1983年被判处有期徒刑十七年。"},
  first:{m:["全国第一张马列主义大字报"],t:"“全国第一张马列主义的大字报”",b:"毛泽东对聂元梓大字报的评语。1966年6月1日晚中央人民广播电台播出这张大字报，次日《人民日报》全文刊登，并配发评论员文章《欢呼北大的一张大字报》。它向全国传递了一个信号：群众可以公开批判本单位的党组织。"},
  dzb:{m:["大字报"],t:"大字报",b:"用毛笔写在大张纸上、贴在公共场所的文字，是文革中最主要的群众表达方式。写谁、签不签名、贴在哪里，都可能决定一个人此后的命运。"},
  sanjia:{m:["三家村"],t:"三家村",b:"邓拓、吴晗、廖沫沙三人1961年起在北京市委刊物《前线》上合写杂文专栏“三家村札记”。1966年5月被定为“反党反社会主义”的黑店，遭全国批判。文革初期很多单位的大字报先批这类远处的目标，本单位的领导则不敢碰。"},
  gzd:{m:["工作队"],t:"工作队",b:"1966年6月，在毛泽东离京期间主持中央一线工作的刘少奇、邓小平决定向学校和工厂派驻工作队，领导运动。工作队普遍把矛头引向“牛鬼蛇神”和给党委提意见的群众。7月底毛泽东回京后批评工作队“压制群众”，下令撤出学校，此后“反工作队”成为造反派的正当性来源。"},
  nggs:{m:["牛鬼蛇神"],t:"牛鬼蛇神",b:"文革中对各种“阶级敌人”的泛称，范围可以无限扩大：地主、富农、反革命、坏分子、右派，以及有“历史问题”的人。把运动的重点放在“横扫牛鬼蛇神”，往往意味着整的是普通群众，而不是当权者。"},
  dangan:{m:["档案袋"],t:"档案与黑材料",b:"中国城市单位中每人都有一份人事档案，由组织保管，本人不能查看，随人调动，决定入党、提干、分房等一切事务。文革初期工作队和党委收集群众的言行整理成材料装进档案，后来被称作“黑材料”。要求销毁黑材料，是1966年秋冬造反派最迫切的诉求之一。"},
  shiliu:{m:["《十六条》"],t:"《十六条》",b:"1966年8月8日八届十一中全会通过的《中共中央关于无产阶级文化大革命的决定》，共十六条。它规定运动的重点是“整党内那些走资本主义道路的当权派”，并警告不准把群众打成反革命。造反派普遍把它当作护身符。"},
  liao:{m:["廖祖康"],t:"廖祖康",b:"1948年生，国棉十七厂职业学校学生。文革初期带红卫兵为王洪文解围，此后一直追随他，后来成为王洪文在北京的生活秘书。他的回忆是关于王洪文私生活的重要来源，但网上流传的版本大多经过改写。"},
  hongqi:{m:["《红旗》杂志"],t:"《红旗》杂志",b:"中共中央理论刊物，文革中由陈伯达等人主持，与《人民日报》《解放军报》合称“两报一刊”，其社论往往代表最高层的最新意图。"},
  fdlx:{m:["资产阶级反动路线"],t:"资产阶级反动路线",b:"1966年10月《红旗》社论和中央工作会议正式提出的说法，指文革初期派工作队、打击群众的做法。一旦被定为“反动路线”，此前被整的群众就可以要求平反，此前整人的干部则要检讨。这个转向让大批基层造反派从“被整的人”变成了“正确的人”。"},
  hwb:{m:["红卫兵"],t:"红卫兵",b:"1966年起以大中学生为主的群众组织。8月起毛泽东在天安门多次接见红卫兵，全国“大串联”开始，学生免费乘车四处串联。北京学生到上海串联，是上海工人造反派早期的重要推动力。"},
  wxz:{m:["王秀珍"],t:"王秀珍",b:"国棉三十厂工人，劳动模范，工总司早期骨干，后任上海市委书记，是文革中职位最高的上海女工之一。1976年后被清查判刑。"},
  hjh:{m:["黄金海"],t:"黄金海（1935—2015）",b:"国棉三十一厂工人，1965年被评为上海市五好工人。文革初期因大字报被打成反党分子，愤而造反，是工总司的筹建者之一，后任上海市革委会常委。1976年后以“反革命罪”被判刑十五年，1991年出狱，晚年写成回忆录《十年非梦》。"},
  wuhao:{m:["五好工人"],t:"五好工人",b:"六十年代工厂里评比的荣誉称号，要求政治思想、完成任务、遵守纪律、团结互助、学习好。能当选的通常是车间里公认的积极分子。"},
  fandang:{m:["反党反社会主义分子"],t:"反党反社会主义分子",b:"一种政治定性。一旦被扣上，不仅本人在单位里抬不起头，档案里也会留下记录，家属同样受到影响。文革初期很多只是给基层党组织提意见的人都被这样定性。"},
  maoxuan:{m:["学毛选"],t:"学毛选",b:"学习《毛泽东选集》。六十年代全国推广“学毛著”运动，工厂车间普遍组织学习小组。批评党组织学毛选不认真，本来是站在最正确的立场上提意见，却照样可以被打成反党。"},
  pan:{m:["潘国平"],t:"潘国平",b:"上海玻璃机械厂青年工人，工总司早期最活跃的领导人之一，人称“潘司令”，一度名气在王洪文之上。安亭事件后带人去苏州。此后逐渐被边缘化，多次受到审查。"},
  gzs:{m:["上海工人革命造反总司令部","工总司"],t:"工总司",b:"上海工人革命造反总司令部，1966年11月成立，王洪文为主要负责人。它是全国第一个被中央文革小组明确支持的跨行业、全市性工人造反组织。1967年后逐步体制化，骨干进入各级革委会，在上海政坛活跃了整整十年。"},
  cao:{m:["曹荻秋"],t:"曹荻秋（1909—1976）",b:"时任上海市长、市委书记处书记，市委第一书记陈丕显病休期间主持日常工作。对工总司采取“不参加、不承认、不支持”的方针。1967年一月风暴后被打倒，1976年去世。"},
  sanbu:{m:["不参加，不承认，不支持"],t:"“三不”方针",b:"上海市委对工总司的态度。当时中央的规定是工人不得跨厂串联、不得成立跨行业组织，市委以此为依据。在造反派看来，这等于宣布他们非法。"},
  nzzz:{m:["北站"],t:"上海北站",b:"当时上海的铁路总站，沪宁线的起点。11月9日深夜，工总司的工人从这里挤上北去的列车。"},
  anting:{m:["安亭"],t:"安亭",b:"上海嘉定县的一个小镇，沪宁铁路上的一个小站。1966年11月10日，北上工人的列车在这里被停下，工人卧轨拦车，史称“安亭事件”。"},
  hn:{m:["沪宁线"],t:"沪宁铁路",b:"上海到南京的铁路，当时是全国最繁忙的干线之一，连接京沪线。它中断三十多个小时，近百趟列车受阻，是震动中央的大事。"},
  cwd:{m:["赤卫队"],t:"赤卫队",b:"上海工人赤卫队，保守派工人组织，成员多是党团员、劳模和积极分子，主张保卫市委、坚持生产。安亭事件后迅速发展到数十万人。12月30日在康平路市委驻地与工总司发生大规模冲突，被击溃，此后瓦解。"},
  cbd:{m:["陈伯达"],t:"陈伯达（1904—1989）",b:"毛泽东的长期秘书，中央文革小组组长，《红旗》杂志总编辑。安亭事件时曾发电报劝工人回上海“抓革命促生产”。1970年庐山会议后倒台。"},
  zcq:{m:["张春桥"],t:"张春桥（1917—2005）",b:"上海市委书记处书记、中央文革小组副组长。安亭事件中他未经华东局和上海市委同意，签字承认工总司合法，由此在上海建立起自己的群众基础，王洪文也由此进入他的视野。后为“四人帮”成员，1981年被判处死刑缓期执行。"},
  zyw:{m:["中央文革小组"],t:"中央文革小组",b:"1966年5月成立，名义上隶属政治局常委会，实际上成为文革的指挥中枢。组长陈伯达，顾问康生，第一副组长江青，副组长张春桥等。它对哪个群众组织表态支持，几乎决定该组织的命运。"},
  hdj:{m:["华东局"],t:"华东局",b:"中共中央华东局，中央派驻华东地区的领导机构，地位在上海市委之上。安亭事件中它与上海市委都主张不承认工总司。"},
  wuxiang:{m:["五项要求"],t:"五项要求",b:"11月13日张春桥签字同意的工总司要求，大致包括：承认工总司是合法的革命组织，承认安亭事件是革命行动，后果由华东局和上海市委负责，曹荻秋公开检讨，为工总司工作提供方便。它推翻了市委此前的全部立场。"},
  qincheng:{m:["秦城"],t:"秦城监狱",b:"位于北京昌平，关押高级别政治犯的监狱。王洪文1976年被捕后在此关押，1981年被判处无期徒刑，1986年后因病转院治疗，1992年8月3日病逝。"},
};
const GLIST = Object.entries(GLOSS).flatMap(([k,v])=>v.m.map(x=>[x,k])).sort((a,b)=>b[0].length-a[0].length);
function gloss(html){
  const slots=[]; const used=new Set();
  for(const [term,key] of GLIST){
    if(used.has(key)) continue;
    const idx = html.indexOf(term);
    if(idx<0) continue;
    const before = html.slice(0,idx);
    if(before.lastIndexOf("<")>before.lastIndexOf(">")) continue;
    used.add(key);
    slots.push(`<button type="button" class="g" data-g="${key}">${term}</button>`);
    html = before + "\u0000"+(slots.length-1)+"\u0000" + html.slice(idx+term.length);
  }
  used.forEach(k=>{ if(!st.seen.includes(k)) st.seen.push(k) });
  return html.replace(/\u0000(\d+)\u0000/g,(_,i)=>slots[+i]);
}
const sheet = document.getElementById("sheet");
function openGloss(key){
  const g = GLOSS[key]; if(!g) return;
  sheet.querySelector("h4").textContent = g.t;
  sheet.querySelector("p").textContent = g.b;
  sheet.hidden = false;
  sheet.querySelector(".x").focus();
}
document.addEventListener("click",e=>{
  const b = e.target.closest(".g"); if(b){ openGloss(b.dataset.g); return }
  if(e.target.closest("#sheet .x")) sheet.hidden = true;
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") sheet.hidden=true });

  if(tab==="huang"||tab==="xu"||tab==="li"){
    const name = {huang:"战友的讲法　仿黄金海《十年非梦》的立场",xu:"官员的讲法　仿徐景贤《十年一梦》的立场",li:"研究者的讲法　仿李逊《革命造反年代》的立场"}[tab];
    body = `<div class="lens"><h3 style="font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:500;margin:0">${name}</h3>
      <p>${lensText(tab)}</p>
      <p class="disclaim">以上为依据各书立场的仿写，不是原文，也不代表作者真实说过这些话。</p></div>`;
  } else if(tab==="rel"){
    body = `<div class="rel">
      <div><b>潘国平</b><span>${r.pan}</span></div>
      <div><b>黄金海</b><span>${r.huang}</span></div>
      <div><b>张春桥</b><span>${r.zhang}</span></div>
      <div><b>周月娥</b><span>${r.zhou}</span></div></div>`;
  } else if(tab==="hist"){
    body = gloss(`<div class="lens"><p>历史上，11月6日工总司在愚园路筹备；9日在文化广场开成立大会，曹荻秋没有到场，会场一度混乱；当晚工人北上，列车停在安亭，工人卧轨拦车，沪宁线中断三十多小时。陈伯达来电劝返。13日张春桥签下五项要求，承认工总司合法、安亭事件为革命行动。王洪文带多数人回沪，潘国平带一部分人去了苏州。</p>
      <p>这件事让工总司合法化，也让王洪文从一个工厂保卫干事，开始进入张春桥的视野。</p>
      <p class="disclaim">下一幕：解放日报事件、康平路（尚未制作）</p></div>`);
  }
  app.innerHTML = `<div class="fade">
    <div class="stamp">198?年 · 夜</div><div class="place">秦城监狱</div>
    <h2>${outcome()==="home"?"你没有去安亭":"安亭之后"}</h2>
    <div class="story"><p>你醒过来。同一件事，有好几种讲法。</p></div>
    <div class="tabs" role="tablist">
      ${[["huang","战友"],["xu","官员"],["li","研究者"],["rel","人物"],["hist","史实"]].map(([k,n])=>`<button class="tbtn" id="lens-${k}" aria-pressed="${tab===k}" data-k="${k}">${n}</button>`).join("")}
    </div>
    <div class="panel">${body}</div>
    <div class="bar"><button class="tbtn" id="t-arch" aria-pressed="${st.tab==='arch'}">档案</button><button class="tbtn" id="t-gl" aria-pressed="${st.tab==='gl'}">词条</button></div>
    ${st.tab==='arch'?archivePanel():''}${st.tab==='gl'?glossPanel():''}
    <button class="restart" id="again">再做一次梦</button>
  </div>`;
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ st.lens=b.dataset.k; save(); render(); });
  bindBar();
  document.getElementById("again").onclick=()=>{
    dreamCount++; try{localStorage.setItem("mfm-dreams",String(dreamCount))}catch(e){}
    st=Object.assign({},S0,{facts:[],archive:[]}); st.scene="p1"; save(); render(); window.scrollTo({top:0});
  };
}
function save(){}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){
  try{ window.claude.hot.snapshot(()=>({st})) }catch(e){}
}
render();
})();
</script>

</body>
