<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>你的爱之语是什么？</title>
<style>
  :root{ --bg:#FBF0F2;--card:#FFFFFF;--ink:#3A2229;--ink2:#5E434B;--muted:#A68C93;--accent:#D0506F;--soft:#F8DEE4;--line:#F0DDE2;--g1:#E26A86;--g2:#A93A58 }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding:28px 16px 56px}
  .screen{display:none}
  .screen.active{display:block;animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* 首页 */
  .hero{background:linear-gradient(150deg,var(--g1),var(--g2));color:#fff;border-radius:24px;padding:40px 24px 34px;margin-top:12px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero .kicker{font-size:13px;opacity:.85;letter-spacing:2px}
  .hero h1{font-size:31px;line-height:1.32;margin:10px 0 14px;position:relative}
  .hero p{font-size:15px;opacity:.94;position:relative}
  .meta{display:flex;gap:10px;margin:18px 0 24px}
  .meta span{flex:1;background:var(--card);border-radius:14px;padding:12px 0;text-align:center;font-size:13px;color:var(--muted)}
  .meta b{display:block;font-size:18px;color:var(--ink)}
  .btn{display:block;width:100%;min-height:52px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;padding:0 12px}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.soft{background:var(--soft);color:var(--accent)}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn + .btn{margin-top:12px}
  .row{display:flex;gap:10px}
  .row .btn{margin-top:0;flex:1;font-size:15px}
  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.7}
  .author{display:block;margin:36px auto 0;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;font-family:inherit;cursor:pointer}

  /* 答题页 */
  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .qback{border:0;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--ink);cursor:pointer;flex:none;font-family:inherit}
  .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .count{font-size:13px;color:var(--muted);flex:none;min-width:44px;text-align:right}
  #qWrap.anim{animation:fadeIn .28s ease}
  .qtext{font-size:20px;font-weight:700;line-height:1.55;margin-bottom:22px}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;margin-bottom:12px;font-size:15px;color:var(--ink);font-family:inherit;cursor:pointer;line-height:1.55;transition:border-color .15s,background .15s}
  @media (hover:hover){.opt:hover{border-color:var(--accent)}}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .opt.sel{border-color:var(--accent);background:var(--soft)}
  .opt.sel .k{background:var(--accent);color:#fff}

  /* 结果页 */
  .result-img{width:100%;border-radius:16px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .tip{text-align:center;font-size:12px;color:var(--muted);margin:10px 0 18px}
  .card{background:var(--card);border-radius:20px;padding:22px 18px;margin-top:20px}
  .card h3{font-size:18px;margin-bottom:4px}
  .muted{color:var(--muted)}
  .small{font-size:13px}

  /* 作者预览 */
  .pv-item{margin-bottom:28px}
  .pv-item h3{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:8px}

  #toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(30,26,30,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:86vw;text-align:center}
  #toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
  .modal.hidden{display:none}
  .modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px}
  .modal-box p{font-size:14px;color:var(--ink2);margin-bottom:10px}
  .modal-box textarea{width:100%;height:160px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;margin-bottom:12px;resize:none}
  .mycode{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:12px 14px;margin:14px 0 18px}
  .mycode span{font-size:26px;font-weight:800;letter-spacing:6px;color:var(--accent)}
  .mycode button,.last button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;cursor:pointer}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
  .field input:focus{border-color:var(--accent)}
  #taCode{text-transform:uppercase;letter-spacing:4px;font-weight:700}
  .names{display:flex;gap:10px}
  .names .field{flex:1;min-width:0}
  .last{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--soft);color:var(--accent);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}

</style>
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <section id="home" class="screen active">
    <div class="hero">
      <div class="kicker" id="kicker"></div>
      <h1 id="heroTitle"></h1>
      <p id="heroDesc"></p>
    </div>
    <div class="meta" id="meta"></div>
    <button class="btn primary" id="startBtn">开始测试</button>
    <div id="homeExtra"></div>
    <div class="note" id="note"></div>
    <button class="author" id="authorBtn">作者预览：查看全部结果卡</button>
  </section>

  <!-- 答题页 -->
  <section id="quiz" class="screen">
    <div class="qhead">
      <button class="qback" id="qBack" aria-label="上一题">‹</button>
      <div class="bar"><i id="qBar"></i></div>
      <div class="count" id="qNum"></div>
    </div>
    <div id="qWrap">
      <div class="qtext" id="qText"></div>
      <div id="qOpts"></div>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="result" class="screen">
    <img class="result-img" id="resultImg" alt="测试结果">
    <div class="tip">手机上长按图片可以直接保存</div>
    <div class="row">
      <button class="btn primary" id="saveBtn">保存图片</button>
      <button class="btn soft" id="copyBtn">复制文案</button>
      <button class="btn ghost" id="againBtn">再测一次</button>
    </div>
    <div class="card match">
      <h3>和 TA 对一对</h3>
      <p class="muted small">把你的码发给 TA。等 TA 测完，任何一方输入对方的码，都能看到同一份双人报告。</p>
      <div class="mycode"><span id="myCode"></span><button id="copyCodeBtn">复制我的码</button></div>
      <div class="field">
        <label>输入 TA 的匹配码</label>
        <input id="taCode" maxlength="7" placeholder="5 位字母或数字" autocomplete="off">
      </div>
      <div class="names">
        <div class="field"><label>你的昵称（选填）</label><input id="meName" maxlength="8" placeholder="你"></div>
        <div class="field"><label>TA 的昵称（选填）</label><input id="taName" maxlength="8" placeholder="TA"></div>
      </div>
      <button class="btn primary" id="matchBtn">看看我们的爱之语</button>
    </div>

  </section>
  <!-- 双人报告 -->
  <section id="pair" class="screen">
    <img class="result-img" id="pairImg" alt="我们的爱之语报告">
    <div class="tip">手机上长按图片可以直接保存</div>
    <div class="row">
      <button class="btn primary" id="pSaveBtn">保存图片</button>
      <button class="btn soft" id="pCopyBtn">复制文案</button>
    </div>
    <button class="btn ghost" id="pBackBtn" style="margin-top:12px">返回我的结果</button>
  </section>

  <!-- 作者预览 -->
  <section id="preview" class="screen">
    <div class="qhead">
      <button class="qback" id="pvBack" aria-label="返回">‹</button>
      <div style="font-weight:600">全部结果卡预览</div>
    </div>
    <div id="pvList"></div>
  </section>

</div>

<div id="toast"></div>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <p>自动复制没有成功，请长按下面的文字，全选后复制</p>
    <textarea id="manualText" readonly></textarea>
    <button class="btn primary" id="modalClose">好的</button>
  </div>
</div>

<script>
/* ==========================================================
   数据区：改文案只需要改这里
   爱之语测试：五种爱的语言
     W 肯定的言辞 / T 精心的时刻 / G 接受礼物 / A 服务的行动 / P 身体的接触
   20 道二选一，五种语言两两配对，每一对出现两次，所以每种语言都正好出现 8 次，
   得分在 0 到 8 之间，五项加起来一定是 20。
   ========================================================== */
const QUIZ = {
  kicker: '恋爱心理小测试',
  heroTitle: '你的爱之语<br>是什么？',
  heroDesc: '有人要听“我爱你”，有人要你放下手机陪着，有人一个拥抱就够了。20 道二选一，找到你接收爱的母语，再和 TA 对一对。',
  meta: [['20', '道题'], ['3', '分钟'], ['5', '种语言']],
  note: '“五种爱的语言”来自盖瑞·查普曼的同名书。这是趣味版，结果只代表一个倾向。',
  cardHead: '爱之语测试',
  footer: '爱之语测试 · 长按图片保存',
  shuffle: true,
  colors: { bg: '#FBF0F2', card: '#FFFFFF', ink: '#3A2229', ink2: '#5E434B', muted: '#A68C93',
    accent: '#D0506F', soft: '#F8DEE4', line: '#F0DDE2', g1: '#E26A86', g2: '#A93A58' },
};

const ORDER = ['W', 'T', 'G', 'A', 'P'];

const QUESTIONS = [
  { q: '纪念日那天，你更想要：', opts: [{ t: '一封 TA 手写的长信', l: 'W' }, { t: '一整天，TA 都不看手机，只陪着你', l: 'T' }] },
  { q: 'TA 出差回来，哪一个更让你开心：', opts: [{ t: 'TA 给你带了一份小礼物', l: 'G' }, { t: 'TA 出发前把家里收拾得干干净净', l: 'A' }] },
  { q: '周末晚上，你更想：', opts: [{ t: '窝在沙发上看电影，TA 从后面抱着你', l: 'P' }, { t: '两个人出去散步，一直聊到很晚', l: 'T' }] },
  { q: '你加班到很晚，哪一个更暖：', opts: [{ t: 'TA 发来一句“辛苦了，你真的很厉害”', l: 'W' }, { t: 'TA 给你送来一份热乎的夜宵', l: 'A' }] },
  { q: '早上醒来，你更希望：', opts: [{ t: '床头放着 TA 准备的一个小惊喜', l: 'G' }, { t: 'TA 还没醒，迷迷糊糊地把你抱住', l: 'P' }] },
  { q: '你过生日，哪一个更戳你：', opts: [{ t: 'TA 当着朋友的面，说了一段很动人的话', l: 'W' }, { t: 'TA 送了你惦记了很久的那样东西', l: 'G' }] },
  { q: '你遇到一个难题，更希望 TA：', opts: [{ t: '陪你坐下来，一起想办法，想多久都陪着', l: 'T' }, { t: '二话不说，直接帮你把事情办好', l: 'A' }] },
  { q: '你心情很差的时候，更需要：', opts: [{ t: 'TA 说“没关系，我一直在”', l: 'W' }, { t: 'TA 什么也不说，只是抱紧你', l: 'P' }] },
  { q: '你累了一整天，更想要：', opts: [{ t: 'TA 帮你按按肩膀', l: 'P' }, { t: 'TA 把你手上的活接过去做完', l: 'A' }] },
  { q: '你们的周年，你更期待：', opts: [{ t: '一起去一个都没去过的地方，待上一整天', l: 'T' }, { t: '一份 TA 偷偷准备了很久的礼物', l: 'G' }] },
  { q: '普通的一天，哪一个更让你心动：', opts: [{ t: 'TA 突然发来“今天也很喜欢你”', l: 'W' }, { t: 'TA 说“今晚早点下班，我们去吃那家店吧”', l: 'T' }] },
  { q: '你搬新家，哪一个更让你感动：', opts: [{ t: 'TA 送了一盆你喜欢的绿植当乔迁礼', l: 'G' }, { t: 'TA 请了一天假来帮你搬', l: 'A' }] },
  { q: '异地这么久，终于见面的第一刻：', opts: [{ t: '一个长长的拥抱', l: 'P' }, { t: '接下来三天，TA 把所有时间都空出来给你', l: 'T' }] },
  { q: '你做了一顿饭，哪一个更让你开心：', opts: [{ t: 'TA 边吃边夸，说比外面的还好吃', l: 'W' }, { t: 'TA 吃完主动把碗洗了', l: 'A' }] },
  { q: '你出远门一周回来，TA 来机场接你：', opts: [{ t: '手里捧着一束花', l: 'G' }, { t: '一见面就抱住你，半天不撒手', l: 'P' }] },
  { q: '平平常常的周三，哪一个更让你惊喜：', opts: [{ t: '收到 TA 一段长消息，说起你们刚认识的时候', l: 'W' }, { t: '收到 TA 给你寄来的一个小包裹', l: 'G' }] },
  { q: '难得的周末，你更想要：', opts: [{ t: 'TA 陪你逛一下午你喜欢的店', l: 'T' }, { t: 'TA 帮你把拖了很久的杂事一口气处理完', l: 'A' }] },
  { q: '吵完架和好，哪一个更能让你消气：', opts: [{ t: 'TA 认真地说“对不起，刚才是我说话太冲了”', l: 'W' }, { t: 'TA 走过来，把你拉进怀里', l: 'P' }] },
  { q: '下雨天，哪一个更让你心动：', opts: [{ t: 'TA 撑着伞来公司楼下接你', l: 'A' }, { t: '走在路上，TA 一直牵着你的手', l: 'P' }] },
  { q: '你升职了，更希望 TA：', opts: [{ t: '请一天假，陪你好好庆祝', l: 'T' }, { t: '送你一件用心挑的礼物', l: 'G' }] },
];

const LANGS = {
  W: { name: '肯定的言辞', short: '言语', char: '言', persona: '要你说出口的人',
    tag: '“我爱你”不嫌多，“你真棒”也不嫌多',
    desc: '对你来说，爱要说出来才算数。一句具体的夸奖、一条认真的长消息、一句“有你真好”，能让你开心好几天。反过来，一句重话也能让你难受很久。',

    howTo: ['别只说“挺好”，说具体：“你今天那个方案讲得特别清楚”', '想念就说出来，不用等特别的日子', '再生气，也别说伤人的话'],
    signal: '夸对方、发来长长的消息' },
  T: { name: '精心的时刻', short: '陪伴', char: '陪', persona: '要你放下手机的人',
    tag: '你在我身边，而且真的在',
    desc: '你最想要的，是 TA 完整的注意力。不用去多贵的地方，只要两个人认真地待在一起，说话时看着彼此，你就觉得被爱着。人在旁边却一直看手机，对你来说比不在还难受。',
    moves: ['TA 推掉别的安排，专门空出一个周末给你', '散步的时候什么都聊，聊到忘了时间', 'TA 认真听你讲完一件小事，还追问了细节'],
    hurt: '约会时 TA 一直回工作消息，或者说好的见面临时取消。',
    howTo: ['约会时把手机扣在桌上', '每周留一段只属于两个人的固定时间', 'TA 说话的时候，停下手里的事，看着 TA'],
    signal: '推掉别的事来陪对方' },
  G: { name: '接受礼物', short: '礼物', char: '礼', persona: '记得住小事的人',
    tag: '礼物不在贵，在于“你想着我”',
    desc: '你在意的不是价格，而是礼物背后的那份惦记。TA 路过便利店带回你爱喝的饮料，出差带回一张当地的明信片，都会让你觉得：TA 不在我身边的时候，也想着我。',

  A: { name: '服务的行动', short: '行动', char: '做', persona: '看你怎么做的人',

    signal: '靠过来牵手、拥抱' },
};

/* 双人报告：CP 名称 */
const PAIR_CP = {
  same: { name: '同一种母语', desc: '你们用同一种方式表达爱，也用同一种方式接收爱。很多时候，不用翻译就懂。' },
  dialect: { name: '听得懂的方言', desc: '口音不一样，但彼此都听得懂。稍微留心一下，就能说到对方心里。' },
  dict: { name: '需要一本词典', desc: '你们的母语不一样，但也都不是对方的盲区。学几句对方的语言，就够用了。' },
  miss: { name: '鸡同鸭讲', desc: '一个人最在意的，恰好是另一个人最不在意的。你们都在认真地爱，只是频道没对上。' },
};

/* ==========================================================
   计分与匹配码
   ========================================================== */
function withMeta(scores) {
  const max = Math.max(...ORDER.map(k => scores[k]));
  const top = ORDER.filter(k => scores[k] === max);
  const ranked = ORDER.slice().sort((a, b) => scores[b] - scores[a] || ORDER.indexOf(a) - ORDER.indexOf(b));
  return { scores, top, ranked, code: encodeCode(scores) };
}
QUIZ.score = answers => {
  const scores = { W: 0, T: 0, G: 0, A: 0, P: 0 };
  QUESTIONS.forEach((q, i) => { scores[q.opts[answers[i]].l]++; });
  return withMeta(scores);
};

/* 把五个分数压成 5 位码，外加校验位并打乱。纯本地计算，不需要网络 */
const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 去掉了容易看错的 I O 0 1
const MOD = 33554432, MUL = 1103515, ADD = 7777777;
function modInverse(a, m) {
  let r0 = a, r1 = m, s0 = 1, s1 = 0;
  while (r1 !== 0) { const q = Math.floor(r0 / r1); [r0, r1] = [r1, r0 - q * r1]; [s0, s1] = [s1, s0 - q * s1]; }
  return ((s0 % m) + m) % m;
}
const INV = modInverse(MUL, MOD);
const mulmod = (a, b) => (a * b) % MOD; // 两数都小于 2^25，乘积不会超出安全整数
function encodeCode(scores) {
  const v = ORDER.reduce((s, k) => s * 9 + scores[k], 0);
  const payload = v * 31 + ((v * 13 + 5) % 31);
  let x = (mulmod(payload, MUL) + ADD) % MOD, out = '';
  for (let i = 0; i < 5; i++) { out = ALPH[x % 32] + out; x = Math.floor(x / 32); }
  return out;
}
function decodeCode(str) {
  const s = String(str || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (s.length !== 5) return null;
  let x = 0;
  for (const ch of s) { const i = ALPH.indexOf(ch); if (i < 0) return null; x = x * 32 + i; }
  const payload = mulmod(((x - ADD) % MOD + MOD) % MOD, INV);
  let v = Math.floor(payload / 31);
  if (v >= 9 ** 5 || payload % 31 !== (v * 13 + 5) % 31) return null;
  const scores = {};
  for (let i = ORDER.length - 1; i >= 0; i--) { scores[ORDER[i]] = v % 9; v = Math.floor(v / 9); }
  if (ORDER.reduce((s, k) => s + scores[k], 0) !== QUESTIONS.length) return null;
  return withMeta(scores);
}

/* ==========================================================
   单人结果卡
   ========================================================== */
const topName = r => r.top.map(k => LANGS[k].short).join(' × ');
QUIZ.blocks = r => {
  const L = LANGS[r.top[0]], dual = r.top.length > 1;
  const blocks = [
    { t: 'text', text: '你的爱之语是', size: 32, color: COL.muted, align: 'center' },

    { t: 'text', text: dual ? '双母语：你同时说着好几种语言' : `你是${L.persona}`, size: 30, color: COL.muted, align: 'center' },
    { t: 'gap', h: 18 },

    { t: 'gap', h: 10 },
    { t: 'codebox', label: '我的爱之语匹配码', code: r.code, hint: '发给 TA，测完输入这个码\n看看你们说的是不是同一种语言' },
  );
  return blocks;
};

/* ==========================================================
   双人报告
   ========================================================== */
function cosine(a, b) {
  let d = 0, na = 0, nb = 0;
  ORDER.forEach(k => { d += a[k] * b[k]; na += a[k] * a[k]; nb += b[k] * b[k]; });
  return d / Math.sqrt(na * nb);
}
function pairResult(me, ta, names) {
  const lowest = r => ORDER.filter(k => r.scores[k] === Math.min(...ORDER.map(x => r.scores[x])));
  const second = r => r.ranked.slice(0, 2);
  let kind;
  if (me.top.some(k => ta.top.includes(k))) kind = 'same';
  else if (me.top.some(k => lowest(ta).includes(k)) || ta.top.some(k => lowest(me).includes(k))) kind = 'miss';
  else if (me.top.some(k => second(ta).includes(k)) || ta.top.some(k => second(me).includes(k))) kind = 'dialect';
  else kind = 'dict';
  const c = cosine(me.scores, ta.scores);
  const index = Math.max(52, Math.min(98, Math.round(52 + (c - 0.45) / 0.55 * 46)));
  return { kind, cp: PAIR_CP[kind], index, names };
}
function pairBlocks(me, ta, p) {
  const { names } = p, mL = LANGS[me.top[0]], tL = LANGS[ta.top[0]];
  return [
    { t: 'text', text: `${names.me} × ${names.ta}`, size: 34, weight: 700, align: 'center' },
    { t: 'text', text: `${topName(me)} × ${topName(ta)}`, size: 28, color: COL.muted, align: 'center' },
    { t: 'gap', h: 30 },
    { t: 'text', text: '你们的爱之语关系是', size: 30, color: COL.muted, align: 'center' },
    { t: 'gap', h: 10 },
    { t: 'big', text: `「${p.cp.name}」`, size: 76 },
    { t: 'gap', h: 16 },
    { t: 'text', text: p.cp.desc, size: 32, color: COL.ink2, align: 'center' },
    { t: 'gap', h: 40 },
    { t: 'score', label: '爱之语默契度', value: p.index },
    { t: 'gap', h: 10 },
    { t: 'dual', me, ta, names },
    { t: 'divider' },
    { t: 'list', title: `${names.me}想让${names.ta}感受到爱，可以`, items: tL.howTo },
    { t: 'list', title: `${names.ta}想让${names.me}感受到爱，可以`, items: mL.howTo },
    { t: 'section', title: '别错过的信号', text: `人往往用自己最想要的方式去爱别人。当${names.me}${mL.signal}，那就是在对${names.ta}说“我爱你”；当${names.ta}${tL.signal}，也是。` },
  ];
}

/* 双人条形图：每种语言上下两条 */
QUIZ.customBlocks = {
  dual(ctx, b, y, draw) {
    if (draw) {
      ctx.textBaseline = 'top'; ctx.font = F(26, 600);
      ctx.textAlign = 'left'; ctx.fillStyle = COL.accent; dot(ctx, X0 + 10, y + 14, 10); ctx.fillText(b.names.me, X0 + 30, y);
      const w = ctx.measureText(b.names.me).width;
      ctx.fillStyle = COL.muted; dot(ctx, X0 + 80 + w, y + 14, 10); ctx.fillText(b.names.ta, X0 + 100 + w, y);
    }
    y += 64;
    ORDER.forEach(k => {
      if (draw) {
        ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.font = F(30, 600); ctx.fillStyle = COL.ink;
        ctx.fillText(LANGS[k].name, X0, y);
        [[b.me, COL.accent, 0], [b.ta, COL.muted, 26]].forEach(([r, c, off]) => {
          const ty = y + 50 + off;
          ctx.fillStyle = COL.line; rr(ctx, X0, ty, CW - 90, 14, 7); ctx.fill();
          ctx.fillStyle = c; rr(ctx, X0, ty, Math.max(14, (CW - 90) * r.scores[k] / 8), 14, 7); ctx.fill();
          ctx.font = F(24, 600); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
          ctx.fillText(r.scores[k], X0 + CW, ty + 7);
        });
      }
      y += 124;
    });
    return y + 10;
  },
};

/* ==========================================================
   页面：匹配码与双人报告
   ========================================================== */
const STORE_KEY = 'love_language_code';
const pairState = { img: '', text: '', cpName: '' };
QUIZ.onResult = r => { $('#myCode').textContent = r.code; store(STORE_KEY, r.code); };
function doMatch() {
  const raw = $('#taCode').value, ta = decodeCode(raw), me = state.result;
  if (!ta) { toast('这个匹配码好像不对，检查一下有没有输错'); return; }
  if (raw.toUpperCase().replace(/[^A-Z0-9]/g, '') === me.code) { toast('这是你自己的码哦，要输入 TA 的'); return; }
  const names = { me: $('#meName').value.trim() || '你', ta: $('#taName').value.trim() || 'TA' };
  const p = pairResult(me, ta, names);
  pairState.img = renderCard('我们的爱之语报告', pairBlocks(me, ta, p)).toDataURL('image/png');
  pairState.cpName = p.cp.name;
  pairState.text = `${names.me} × ${names.ta}（${topName(me)} × ${topName(ta)}）\n我们的爱之语关系是「${p.cp.name}」，默契度 ${p.index}%。\n${p.cp.desc}\n\n${names.me}想让${names.ta}感受到爱：${LANGS[ta.top[0]].howTo.join('；')}\n${names.ta}想让${names.me}感受到爱：${LANGS[me.top[0]].howTo.join('；')}`;
  $('#pairImg').src = pairState.img;
  show('pair');
}
QUIZ.init = () => {
  $('#copyCodeBtn').onclick = () => copyText(state.result.code);
  $('#matchBtn').onclick = doMatch;
  $('#pSaveBtn').onclick = () => saveImg(pairState.img, `爱之语报告-${pairState.cpName}.png`);
  $('#pCopyBtn').onclick = () => copyText(pairState.text);
  $('#pBackBtn').onclick = () => show('result');
  const last = decodeCode(load(STORE_KEY));
  if (last) {
    $('#homeExtra').innerHTML = `<div class="last"><span>你上次的匹配码 <b>${last.code}</b></span><button id="lastBtn">查看结果</button></div>`;
    $('#lastBtn').onclick = () => showResult(last);
  }
};

QUIZ.copy = r => {
  const L = LANGS[r.top[0]];
  return `我测了「爱之语」，我的爱之语是「${r.top.map(k => LANGS[k].name).join(' × ')}」：${L.tag}。\n\n${L.desc}\n\n想爱我的人，可以这样做：${L.howTo.join('；')}\n\n我的匹配码是 ${r.code}，你也来测一下，输入我的码，看看我们说的是不是同一种语言。`;
};
QUIZ.fileName = r => `爱之语-${topName(r)}.png`;
QUIZ.previews = () => {
  const list = ORDER.map(k => {
    const s = { W: 4, T: 4, G: 4, A: 4, P: 4 }; s[k] = 7;
    const o = ORDER.filter(x => x !== k); s[o[0]] = 5; s[o[1]] = 3; s[o[2]] = 3; s[o[3]] = 2;
    return { label: LANGS[k].name, result: withMeta(s) };
  });

/* ==========================================================
   通用引擎：答题流程、结果卡绘制、保存与复制
   改文案请改上面的数据区，下面一般不需要动
   ========================================================== */
const $ = s => document.querySelector(s);
const COL = QUIZ.colors;
const FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const F = (size, weight) => `${weight || 400} ${size}px ${FONT}`;
const W = 1080, CX = 540, X0 = 140, CW = 800, START = 250;
const NO_LINE_START = '，。！？、；：”’）」』》…,.!?;:)';
const KEYS = 'ABCDEFG';
const state = { answers: [], order: [], idx: 0, locked: false, result: null, img: '' };

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#' + id).classList.add('active');
  window.scrollTo(0, 0);
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
const pct = (v, max) => Math.round(v / max * 100);

/* ---------- 答题 ---------- */
function startQuiz() {
  state.answers = new Array(QUESTIONS.length).fill(null);
  state.order = QUESTIONS.map(q => { const ix = q.opts.map((_, i) => i); return QUIZ.shuffle ? shuffle(ix) : ix; });
  state.idx = 0; state.locked = false;
  show('quiz'); renderQ();
}
function renderQ() {
  const i = state.idx, q = QUESTIONS[i];
  $('#qNum').textContent = `${i + 1}/${QUESTIONS.length}`;
  $('#qBar').style.width = ((i + 1) / QUESTIONS.length * 100) + '%';
  $('#qText').textContent = q.q;
  const box = $('#qOpts'); box.innerHTML = '';
  state.order[i].forEach((oi, pos) => {
    const b = document.createElement('button');
    b.className = 'opt' + (state.answers[i] === oi ? ' sel' : '');
    b.innerHTML = `<span class="k">${KEYS[pos]}</span><span></span>`;
    b.lastChild.textContent = q.opts[oi].t;
    b.addEventListener('click', () => choose(oi, b));
    box.appendChild(b);
  });
  const w = $('#qWrap'); w.classList.remove('anim'); void w.offsetWidth; w.classList.add('anim');
}
/* 防连点：选中后到切题完成之前，其他点击一律忽略 */
function choose(oi, el) {
  if (state.locked) return;
  state.locked = true;
  state.answers[state.idx] = oi;
  document.querySelectorAll('#qOpts .opt').forEach(o => o.classList.remove('sel'));
  el.classList.add('sel');
  setTimeout(() => {
    if (state.idx < QUESTIONS.length - 1) { state.idx++; renderQ(); }
    else finish();
    state.locked = false;
  }, 300);
}
function goBack() {
  if (state.locked) return;
  if (state.idx > 0) { state.idx--; renderQ(); } else show('home');
}
/* 结算前检查漏答：有漏答就跳回那一题 */
function finish() {
  const miss = state.answers.findIndex(a => a == null);
  if (miss >= 0) { state.idx = miss; renderQ(); toast(`第 ${miss + 1} 题还没选，补上再看结果`); return; }
  showResult(QUIZ.score(state.answers));
}
function showResult(r) {
  state.result = r;
  state.img = renderCard(QUIZ.cardHead, QUIZ.blocks(r)).toDataURL('image/png');
  $('#resultImg').src = state.img;
  if (QUIZ.onResult) QUIZ.onResult(r);
  show('result');
}

/* ---------- 结果卡绘制（canvas，宽 1080） ---------- */
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function dot(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
/* 中文逐字换行，标点不放在行首 */
function wrap(ctx, text, maxW) {
  const lines = []; let cur = '';
  for (const ch of text) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    const test = cur + ch;
    if (ctx.measureText(test).width > maxW && cur && !NO_LINE_START.includes(ch)) { lines.push(cur); cur = ch; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function head(ctx, title, y, draw) {
  if (draw) {
    ctx.fillStyle = COL.accent; rr(ctx, X0, y + 6, 8, 34, 4); ctx.fill();
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.font = F(36, 700); ctx.fillStyle = COL.ink; ctx.fillText(title, X0 + 26, y);
  }
  return y + 64;
}

/* 每种区块：先量高度（draw=false），再真正画（draw=true） */
const BLOCK = {
  gap(ctx, b, y) { return y + b.h; },
  divider(ctx, b, y, draw) {
    if (draw) { ctx.fillStyle = COL.line; ctx.fillRect(X0, y + 40, CW, 2); }
    return y + 84;
  },
  text(ctx, b, y, draw) {
    const size = b.size || 34, lh = Math.round(size * (b.lh || 1.75));
    ctx.font = F(size, b.weight || 400);
    const lines = wrap(ctx, b.text, CW);
    if (draw) {
      ctx.fillStyle = b.color || COL.ink; ctx.textBaseline = 'top';
      ctx.textAlign = b.align === 'center' ? 'center' : 'left';
      lines.forEach((l, i) => ctx.fillText(l, b.align === 'center' ? CX : X0, y + i * lh + (lh - size) / 2));
    }
    return y + lines.length * lh;
  },
  big(ctx, b, y, draw) {
    return BLOCK.text(ctx, { text: b.text, size: b.size || 84, weight: 800, color: b.color || COL.accent, align: 'center', lh: 1.3 }, y, draw);
  },
  /* 印章：一个圆里放一个字 */
  seal(ctx, b, y, draw) {
    const R = 104, cy = y + R + 18;
    if (draw) {
      ctx.fillStyle = COL.soft; dot(ctx, CX, cy, R + 18);
      ctx.fillStyle = COL.accent; dot(ctx, CX, cy, R);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = F(b.text.length > 1 ? 72 : 112, 800);
      ctx.fillText(b.text, CX, cy + 4);
    }
    return y + (R + 18) * 2 + 20;
  },
  tags(ctx, b, y, draw) {
    const H = 62, PX = 28, G = 16;
    ctx.font = F(30, 600);
    const rows = [[]]; let w = 0;
    b.items.forEach(it => {
      const iw = ctx.measureText(it).width + PX * 2;
      if (w + iw > CW && rows[rows.length - 1].length) { rows.push([]); w = 0; }
      rows[rows.length - 1].push({ it, iw }); w += iw + G;
    });
    if (draw) rows.forEach((r, ri) => {
      const tw = r.reduce((s, p) => s + p.iw, 0) + G * (r.length - 1);
      let x = CX - tw / 2; const ty = y + ri * (H + G);
      r.forEach(p => {
        ctx.fillStyle = COL.soft; rr(ctx, x, ty, p.iw, H, H / 2); ctx.fill();
        ctx.fillStyle = COL.accent; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.it, x + p.iw / 2, ty + H / 2 + 1);
        x += p.iw + G;
      });
    });
    return y + rows.length * (H + G) - G;
  },
  section(ctx, b, y, draw) {
    y = head(ctx, b.title, y, draw);
    return BLOCK.text(ctx, { text: b.text, size: 32, color: COL.ink2 }, y, draw) + 44;
  },
  list(ctx, b, y, draw) {
    y = head(ctx, b.title, y, draw);
    const lh = 56;
    b.items.forEach(it => {
      ctx.font = F(32);
      const lines = wrap(ctx, it, CW - 40);
      if (draw) {
        ctx.fillStyle = COL.accent; dot(ctx, X0 + 10, y + lh / 2, 6);
        ctx.fillStyle = COL.ink2; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        lines.forEach((l, i) => ctx.fillText(l, X0 + 36, y + i * lh + (lh - 32) / 2));
      }
      y += lines.length * lh + 10;
    });
    return y + 34;
  },
  quote(ctx, b, y, draw) {
    const pad = 44, lh = 58, labelH = b.label ? 52 : 0;
    ctx.font = F(34, 600);
    const lines = wrap(ctx, b.text, CW - pad * 2);
    const H = pad * 2 + labelH + lines.length * lh - 10;
    if (draw) {
      ctx.fillStyle = COL.soft; rr(ctx, X0, y, CW, H, 28); ctx.fill();
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      if (b.label) { ctx.font = F(26, 600); ctx.fillStyle = COL.muted; ctx.fillText(b.label, CX, y + pad - 8); }
      ctx.font = F(34, 600); ctx.fillStyle = COL.accent;
      lines.forEach((l, i) => ctx.fillText(l, CX, y + pad + labelH + i * lh + (lh - 34) / 2 - 6));
    }
    return y + H + 44;
  },
  /* 横向条形：items = [{label, right, value(0~1), hi}] */
  bars(ctx, b, y, draw) {
    if (b.title) y = head(ctx, b.title, y, draw) + 6;
    b.items.forEach(it => {
      if (draw) {
        ctx.textBaseline = 'top'; ctx.textAlign = 'left';
        ctx.font = F(30, it.hi ? 700 : 500); ctx.fillStyle = it.hi ? COL.ink : COL.ink2;
        ctx.fillText(it.label, X0, y);
        ctx.textAlign = 'right'; ctx.fillStyle = it.hi ? COL.accent : COL.muted;
        ctx.fillText(it.right, X0 + CW, y);
        const ty = y + 52;
        ctx.fillStyle = COL.line; rr(ctx, X0, ty, CW, 14, 7); ctx.fill();
        ctx.globalAlpha = it.hi ? 1 : 0.45;
        ctx.fillStyle = COL.accent; rr(ctx, X0, ty, Math.max(14, CW * Math.min(1, it.value)), 14, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      y += 100;
    });
    return y + 10;
  },
  score(ctx, b, y, draw) {
    if (draw) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = COL.muted; ctx.font = F(30, 600); ctx.fillText(b.label, CX, y);
      ctx.fillStyle = COL.accent; ctx.font = F(120, 800); ctx.fillText(b.value + '%', CX, y + 48);
    }
    return y + 48 + 132;
  },
  codebox(ctx, b, y, draw) {
    ctx.font = F(28);
    const hint = wrap(ctx, b.hint, CW - 100);
    const H = 244 + hint.length * 46 + 40;
    if (draw) {
      ctx.fillStyle = COL.bg; rr(ctx, X0, y, CW, H, 28); ctx.fill();
      ctx.setLineDash([12, 10]); ctx.strokeStyle = COL.accent; ctx.lineWidth = 3;
      rr(ctx, X0, y, CW, H, 28); ctx.stroke(); ctx.setLineDash([]);
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = COL.muted; ctx.font = F(30, 600); ctx.fillText(b.label, CX, y + 48);
      ctx.fillStyle = COL.accent; ctx.font = F(100, 800);
      const cs = b.code.split('');
      cs.forEach((ch, i) => ctx.fillText(ch, CX + (i - (cs.length - 1) / 2) * 112, y + 104));
      ctx.fillStyle = COL.muted; ctx.font = F(28);
      hint.forEach((l, i) => ctx.fillText(l, CX, y + 244 + i * 46));
    }
    return y + H;
  },
};
Object.assign(BLOCK, QUIZ.customBlocks || {});

function renderCard(title, blocks) {
  const c = document.createElement('canvas');
  c.width = W; c.height = 10;
  let ctx = c.getContext('2d');
  let y = START;
  for (const b of blocks) y = BLOCK[b.t](ctx, b, y, false);
  const cardBottom = y + 60, H = cardBottom + 150;
  c.height = H; ctx = c.getContext('2d');
  // 背景与顶部色带
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, W, 340);
  g.addColorStop(0, COL.g1); g.addColorStop(1, COL.g2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 340);
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  dot(ctx, 970, 50, 170); dot(ctx, 70, 290, 90);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = F(38, 700); ctx.fillText(title, CX, 80);
  // 白色卡片
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.08)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 8;
  ctx.fillStyle = COL.card; rr(ctx, 80, 170, 920, cardBottom - 170, 40); ctx.fill();
  ctx.restore();
  y = START;
  for (const b of blocks) y = BLOCK[b.t](ctx, b, y, true);
  ctx.fillStyle = COL.muted; ctx.font = F(26); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(QUIZ.footer, CX, cardBottom + 52);
  return c;
}

/* ---------- 保存与复制 ---------- */
/* 保存图片：优先触发下载，不支持时提示长按 */
function saveImg(url, name) {
  try {
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
  toast('如果没有自动保存，长按上面的图片即可保存');
}
/* 复制：剪贴板接口 → execCommand → 弹窗手动复制，三层备用 */
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); toast('已复制'); return; }
  } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (ok) { toast('已复制'); return; }
  $('#manualText').value = t; $('#modal').classList.remove('hidden');
  setTimeout(() => { $('#manualText').focus(); $('#manualText').select(); }, 50);
}

/* ---------- 作者预览：一次性看全部结果卡 ---------- */
function openPreview() {
  const box = $('#pvList'); box.innerHTML = '';
  QUIZ.previews().forEach(p => {
    const d = document.createElement('div'); d.className = 'pv-item';
    const h = document.createElement('h3'); h.textContent = p.label;
    const img = new Image(); img.className = 'result-img';
    img.src = renderCard(QUIZ.cardHead, QUIZ.blocks(p.result)).toDataURL('image/png');
    d.appendChild(h); d.appendChild(img); box.appendChild(d);
  });
  show('preview');
}

function init() {
  $('#kicker').textContent = QUIZ.kicker;
  $('#heroTitle').innerHTML = QUIZ.heroTitle;
  $('#heroDesc').textContent = QUIZ.heroDesc;
  $('#meta').innerHTML = QUIZ.meta.map(([n, l]) => `<span><b>${n}</b>${l}</span>`).join('');
  $('#note').textContent = QUIZ.note;
  $('#startBtn').onclick = startQuiz;
  $('#qBack').onclick = goBack;
  $('#saveBtn').onclick = () => saveImg(state.img, QUIZ.fileName(state.result));
  $('#copyBtn').onclick = () => copyText(QUIZ.copy(state.result));
  $('#againBtn').onclick = startQuiz;
  $('#authorBtn').onclick = openPreview;
  $('#pvBack').onclick = () => show('home');
  $('#modalClose').onclick = () => $('#modal').classList.add('hidden');
  if (QUIZ.init) QUIZ.init();
}
if (typeof document !== 'undefined') init();

</script>
