<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>恋爱里的你，是哪种依恋体质？</title>
<style>
  :root{ --bg:#F2F0F8;--card:#FFFFFF;--ink:#2A2740;--ink2:#4C4866;--muted:#948FAD;--accent:#6A5FC1;--soft:#E7E4F6;--line:#E3E0EE;--g1:#7D6FD6;--g2:#4F4596 }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding:28px 16px 56px}
  .screen{display:none}
  .screen.active{display:block;animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* 首页 */
  .hero{background:linear-gradient(150deg,var(--g1),var(--g2));color:#fff;border-radius:24px;padding:40px 24px 34px;margin-top:12px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero .kicker{font-size:13px;opacity:.85;letter-spacing:2px}
  .hero h1{font-size:31px;line-height:1.32;margin:10px 0 14px;position:relative}
  .hero p{font-size:15px;opacity:.94;position:relative}
  .meta{display:flex;gap:10px;margin:18px 0 24px}
  .meta span{flex:1;background:var(--card);border-radius:14px;padding:12px 0;text-align:center;font-size:13px;color:var(--muted)}
  .meta b{display:block;font-size:18px;color:var(--ink)}
  .btn{display:block;width:100%;min-height:52px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;padding:0 12px}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.soft{background:var(--soft);color:var(--accent)}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn + .btn{margin-top:12px}
  .row{display:flex;gap:10px}
  .row .btn{margin-top:0;flex:1;font-size:15px}
  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.7}
  .author{display:block;margin:36px auto 0;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;font-family:inherit;cursor:pointer}

  /* 答题页 */
  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .qback{border:0;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--ink);cursor:pointer;flex:none;font-family:inherit}
  .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .count{font-size:13px;color:var(--muted);flex:none;min-width:44px;text-align:right}
  #qWrap.anim{animation:fadeIn .28s ease}
  .qtext{font-size:20px;font-weight:700;line-height:1.55;margin-bottom:22px}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;margin-bottom:12px;font-size:15px;color:var(--ink);font-family:inherit;cursor:pointer;line-height:1.55;transition:border-color .15s,background .15s}
  @media (hover:hover){.opt:hover{border-color:var(--accent)}}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .opt.sel{border-color:var(--accent);background:var(--soft)}
  .opt.sel .k{background:var(--accent);color:#fff}

  /* 结果页 */
  .result-img{width:100%;border-radius:16px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .tip{text-align:center;font-size:12px;color:var(--muted);margin:10px 0 18px}
  .card{background:var(--card);border-radius:20px;padding:22px 18px;margin-top:20px}
  .card h3{font-size:18px;margin-bottom:4px}
  .muted{color:var(--muted)}
  .small{font-size:13px}

  /* 作者预览 */
  .pv-item{margin-bottom:28px}
  .pv-item h3{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:8px}

  #toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(30,26,30,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:86vw;text-align:center}
  #toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
  .modal.hidden{display:none}
  .modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px}
  .modal-box p{font-size:14px;color:var(--ink2);margin-bottom:10px}
  .modal-box textarea{width:100%;height:160px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;margin-bottom:12px;resize:none}

</style>
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <section id="home" class="screen active">
    <div class="hero">
      <div class="kicker" id="kicker"></div>
      <h1 id="heroTitle"></h1>
      <p id="heroDesc"></p>
    </div>
    <div class="meta" id="meta"></div>
    <button class="btn primary" id="startBtn">开始测试</button>
    <div id="homeExtra"></div>
    <div class="note" id="note"></div>
    <button class="author" id="authorBtn">作者预览：查看全部结果卡</button>
  </section>

  <!-- 答题页 -->
  <section id="quiz" class="screen">
    <div class="qhead">
      <button class="qback" id="qBack" aria-label="上一题">‹</button>
      <div class="bar"><i id="qBar"></i></div>
      <div class="count" id="qNum"></div>
    </div>
    <div id="qWrap">
      <div class="qtext" id="qText"></div>
      <div id="qOpts"></div>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="result" class="screen">
    <img class="result-img" id="resultImg" alt="测试结果">
    <div class="tip">手机上长按图片可以直接保存</div>
    <div class="row">
      <button class="btn primary" id="saveBtn">保存图片</button>
      <button class="btn soft" id="copyBtn">复制文案</button>
      <button class="btn ghost" id="againBtn">再测一次</button>
    </div>

  </section>

  <!-- 作者预览 -->
  <section id="preview" class="screen">
    <div class="qhead">
      <button class="qback" id="pvBack" aria-label="返回">‹</button>
      <div style="font-weight:600">全部结果卡预览</div>
    </div>
    <div id="pvList"></div>
  </section>

</div>

<div id="toast"></div>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <p>自动复制没有成功，请长按下面的文字，全选后复制</p>
    <textarea id="manualText" readonly></textarea>
    <button class="btn primary" id="modalClose">好的</button>
  </div>
</div>

<script>
/* ==========================================================
   数据区：改文案只需要改这里
   依恋类型测试：两个维度
     焦虑（怕失去）：anx，正数越怕失去
     回避（怕靠近）：avo，正数越怕靠近
   每道题四个选项正好对应四种体质，每选一次两个维度各 +1 或 -1。
   15 道题，每个维度总分在 -15 到 +15 之间，而且一定是奇数，不会平局。
   ========================================================== */
const QUIZ = {
  kicker: '恋爱心理小测试',
  heroTitle: '恋爱里的你，<br>是哪种依恋体质？',
  heroDesc: '15 个恋爱里的小场景，从「怕失去」和「怕靠近」两个方向，看看你在亲密关系里的默认设置。',
  meta: [['15', '道题'], ['3', '分钟'], ['4', '种体质']],
  note: '依恋理论来自心理学家鲍尔比和后来的成人依恋研究。这是趣味版，结果只代表一个倾向，不是诊断。',
  cardHead: '恋爱依恋体质测试',
  footer: '恋爱依恋体质测试 · 长按图片保存',
  shuffle: true,
  colors: { bg: '#F2F0F8', card: '#FFFFFF', ink: '#2A2740', ink2: '#4C4866', muted: '#948FAD',
    accent: '#6A5FC1', soft: '#E7E4F6', line: '#E3E0EE', g1: '#7D6FD6', g2: '#4F4596' },
};

// S 安全型 / A 焦虑型 / V 回避型 / F 恐惧型
const QUESTIONS = [
  { q: '给 TA 发了消息，两个小时还没回，你：', opts: [
    { t: '大概在忙吧，等 TA 忙完自然会回', a: 'S' },
    { t: '翻回去看聊天记录，是不是自己哪句话说错了', a: 'A' },
    { t: '其实松了口气，正好自己也想安静一会儿', a: 'V' },
    { t: '有点慌，但决定先不理 TA，看谁先找谁', a: 'F' },
  ]},
  { q: 'TA 说：“这周末去见见我爸妈吧。”你：', opts: [
    { t: '好啊，问问叔叔阿姨喜欢什么', a: 'S' },
    { t: '开心到失眠，又担心自己表现不好被 TA 家人嫌弃', a: 'A' },
    { t: '第一反应是“是不是太快了”，找个理由往后推', a: 'V' },
    { t: '嘴上答应，心里已经在想万一以后分手了会有多尴尬', a: 'F' },
  ]},
  { q: '吵完架，TA 说“我需要冷静一下”。你：', opts: [
    { t: '好，等你想聊了我们再聊', a: 'S' },
    { t: '每隔十分钟看一次手机，忍不住又发了一句“你还在生气吗”', a: 'A' },
    { t: '正合我意，我也想先躲开一阵', a: 'V' },
    { t: '觉得 TA 要走了，干脆先说“那就分开吧”', a: 'F' },
  ]},
  { q: '恋爱中，你脑子里最常冒出来的念头是：', opts: [
    { t: '我们挺好的', a: 'S' },
    { t: 'TA 是不是没那么喜欢我了', a: 'A' },
    { t: '我是不是需要多一点自己的时间', a: 'V' },
    { t: '这么好的事，总有一天会坏掉', a: 'F' },
  ]},
  { q: 'TA 想看看你的手机，你：', opts: [
    { t: '递过去，随便看', a: 'S' },
    { t: '递过去，顺便也想看看 TA 的', a: 'A' },
    { t: '不太舒服，这是我自己的地方', a: 'V' },
    { t: '递过去的同时手心出汗，虽然里面什么都没有', a: 'F' },
  ]},
  { q: '在一起一段时间后，TA 变得越来越黏你：', opts: [
    { t: '挺好的，也会告诉 TA 自己什么时候需要独处', a: 'S' },
    { t: '求之不得，终于轮到 TA 黏我了', a: 'A' },
    { t: '开始有点透不过气，回消息越来越慢', a: 'V' },
    { t: '很享受，又害怕自己陷得太深', a: 'F' },
  ]},
  { q: 'TA 在朋友面前开了一个关于你的玩笑：', opts: [
    { t: '跟着一起笑，回家顺口说一句“刚才那个我有点介意”', a: 'S' },
    { t: '当场笑了，回家想了一晚上 TA 是不是真这么看我', a: 'A' },
    { t: '不说什么，心里默默把 TA 往外推了一点', a: 'V' },
    { t: '当场变脸，事后又后悔自己反应太大', a: 'F' },
  ]},
  { q: '关于说“我爱你”这件事：', opts: [
    { t: '想说就说，挺自然的', a: 'S' },
    { t: '说得很多，也很需要听 TA 说', a: 'A' },
    { t: '说出口有点肉麻，能不说就不说', a: 'V' },
    { t: '话到嘴边又咽回去，怕说了 TA 没回应', a: 'F' },
  ]},
  { q: '你发烧了，一个人在家：', opts: [
    { t: '直接跟 TA 说“好难受，能来陪陪我吗”', a: 'S' },
    { t: '很想 TA 来，但先等等，看 TA 会不会自己发现', a: 'A' },
    { t: '自己吃药睡觉，好了再跟 TA 提一句', a: 'V' },
    { t: 'TA 问“要不要我过来”，你说“不用了”，然后有点失望', a: 'F' },
  ]},
  { q: '想象五年后的你们：', opts: [
    { t: '画面挺清楚，也挺期待', a: 'S' },
    { t: '画面很美，但总觉得这不是我能决定的', a: 'A' },
    { t: '有点模糊，暂时不想想那么远', a: 'V' },
    { t: '一想就想到最坏的结局', a: 'F' },
  ]},
  { q: 'TA 出差一周：', opts: [
    { t: '各忙各的，每天聊几句', a: 'S' },
    { t: '第三天就开始数日子，TA 回得晚了就想 TA 在和谁吃饭', a: 'A' },
    { t: '有点开心，终于有几天完全属于自己', a: 'V' },
    { t: '突然开始怀疑这段关系，又觉得自己想太多', a: 'F' },
  ]},
  { q: '回想你过去的感情，结束的方式通常是：', opts: [
    { t: '两个人好好聊过，觉得不合适就分开了', a: 'S' },
    { t: '被分手的那个，很久才走出来', a: 'A' },
    { t: '慢慢淡掉，没有一个明确的结束', a: 'V' },
    { t: '分分合合好几次，最后累了', a: 'F' },
  ]},
  { q: 'TA 问：“你是不是有心事？”你：', opts: [
    { t: '说出来：“其实今天有件事挺烦的”', a: 'S' },
    { t: '一口气说了很多，说完又担心 TA 嫌你烦', a: 'A' },
    { t: '“没事啊。”', a: 'V' },
    { t: '“没事。”然后希望 TA 继续追问', a: 'F' },
  ]},
  { q: '有人说你们俩特别般配：', opts: [
    { t: '笑着说“是吧”', a: 'S' },
    { t: '默默记下来，下次不安的时候拿出来安慰自己', a: 'A' },
    { t: '有点别扭，“还行吧”', a: 'V' },
    { t: '开心，又忍不住想：他们没见过我们吵架的样子', a: 'F' },
  ]},
  { q: '你理想中的恋爱是：', opts: [
    { t: '能靠在一起，也能各自站稳', a: 'S' },
    { t: '每天都能确认，自己是对方最重要的人', a: 'A' },
    { t: '在一起，但各自保留一大块自由', a: 'V' },
    { t: '很想要一段亲密的关系，但不确定自己配不配', a: 'F' },
  ]},
];

const TYPES = {
  S: { name: '港湾', char: '港', sci: '安全型依恋', tag: '靠得近，也放得开',
    desc: '你相信自己值得被爱，也相信对方不会轻易离开。TA 回消息慢，你会想 TA 大概在忙；吵了架，你知道这件事能谈开。和你在一起的人，通常会觉得很松弛。',
    scenes: ['TA 说要和朋友出去玩，你说“玩得开心，到家说一声”，然后真的去做自己的事了', '难过的时候，会直接说“我今天需要你陪”', '吵完架第二天，你是那个先说“我们聊聊吧”的人'],
    crash: '你太稳了，稳到 TA 有时候会问：“你是不是根本不在乎我？”',
    need: '一个同样愿意把话说开的人。你给得出安全感，也值得被同样认真地对待。',
    practice: '偶尔主动说一句“我很在乎你”。你心里有，不代表对方一定知道。',
    match: '和哪种体质都能处得来。遇到向日葵，多给一点确认；遇到猫，多给一点空间。' },
  A: { name: '向日葵', char: '葵', sci: '焦虑型依恋', tag: '脸永远朝着 TA 的方向',
    desc: '你爱得很投入，对 TA 的情绪变化特别敏感。一条消息晚回、一个语气词变了，你都能察觉到。你不是作，你只是很怕这份好会突然不见。',
    scenes: ['打好的消息删了又改，最后发出去的是一个“哦”', 'TA 说“随便”，你开始回想自己今天哪句话说错了', '为了看 TA 有没有给别人点赞，朋友圈刷新了三次'],
    crash: '凌晨一点，你发了一段五百字的长消息，然后盯着“对方正在输入”看了二十分钟。',
    need: '一个说到做到、回应及时的人。稳定的回应，比一百句情话更能让你安心。',
    practice: '心慌的时候，先问问自己：是 TA 真的做了什么，还是我在害怕？把“你是不是不爱我了”换成“我今天有点没安全感，想听你说说话”。',
    match: '和港湾最合拍，TA 的稳定能慢慢把你养松。和猫在一起要小心，你越追，TA 越躲。' },
  V: { name: '猫', char: '猫', sci: '回避型依恋', tag: '喜欢你，但别一直抱着我',
    desc: '你很独立，习惯自己消化情绪，不太愿意依赖别人。关系一旦太近、太黏，你会本能地想退后一步。你不是不爱，你只是需要确认：在一起之后，我还是我。',
    scenes: ['TA 问“你在想什么”，你说“没什么”，其实想了很多', '难过的时候，第一反应是关掉手机，一个人待着', '聊到“以后”，你会下意识地换个话题'],
    crash: 'TA 说“我好想你”，你回了一句“嗯嗯，早点睡”。',
    need: '一个给你空间、不追着要答案的人。节奏被尊重的时候，你反而会主动靠近。',
    practice: '退后之前，先说一句“我需要自己待一会儿，不是因为你”。一句话，就能让对方少胡思乱想一整晚。',
    match: '和港湾在一起最舒服。和向日葵在一起，容易变成一个追、一个逃，需要两个人都往中间走一步。' },
  F: { name: '刺猬', char: '刺', sci: '恐惧型依恋（也叫混乱型）', tag: '想要拥抱，又怕被扎',
    desc: '你非常渴望亲密，但越靠近越紧张。你会在很想要的时候把对方推开，又在对方后退时慌张地追上去。这种拉扯很累，你自己也常常搞不懂自己。',
    scenes: ['TA 对你特别好的时候，你反而开始想“TA 迟早会失望的”', '吵架时脱口而出“那就分开吧”，说完马上后悔', '很想让 TA 来陪你，嘴上却说“不用了”'],
    crash: '你说“你走吧”，TA 真的走了。你在门口站了半小时，希望 TA 回来。',
    need: '一个耐心、稳定、不会被你的刺吓跑的人。也需要一点时间，让你相信靠近不一定会受伤。',
    practice: '试着把心里的两个声音都说出来：“我很想靠近你，但我也有点害怕。”说出口的矛盾，比藏起来的刺好处理得多。',
    match: '和港湾最合适，TA 的稳定能慢慢接住你。和其他体质在一起，都需要多一点耐心和沟通。' },
};

const N = QUESTIONS.length;
function keyOf(anx, avo) { return anx > 0 ? (avo > 0 ? 'F' : 'A') : (avo > 0 ? 'V' : 'S'); }

QUIZ.score = answers => {
  let anx = 0, avo = 0;
  QUESTIONS.forEach((q, i) => {
    const a = q.opts[answers[i]].a;
    anx += (a === 'A' || a === 'F') ? 1 : -1;
    avo += (a === 'V' || a === 'F') ? 1 : -1;
  });
  return { anx, avo, key: keyOf(anx, avo) };
};

/* 离边界很近（某个维度只差 1 分）时，提示身上还有另一种体质的影子 */
function shadowOf(r) {
  if (Math.min(Math.abs(r.anx), Math.abs(r.avo)) > 1) return null;
  return Math.abs(r.anx) <= Math.abs(r.avo) ? keyOf(-r.anx, r.avo) : keyOf(r.anx, -r.avo);
}
const toPct = s => Math.round((s + N) / (2 * N) * 100);

QUIZ.blocks = r => {
  const T = TYPES[r.key], sh = shadowOf(r);
  return [
    { t: 'text', text: '你的恋爱依恋体质是', size: 32, color: COL.muted, align: 'center' },
    { t: 'gap', h: 20 },
    { t: 'seal', text: T.char },
    { t: 'big', text: `「${T.name}」` },
    { t: 'text', text: T.sci, size: 30, color: COL.muted, align: 'center' },
    { t: 'gap', h: 18 },
    { t: 'text', text: T.tag, size: 38, weight: 700, align: 'center' },
    { t: 'gap', h: 44 },
    { t: 'map', x: (r.avo + N) / (2 * N), y: (r.anx + N) / (2 * N), key: r.key },
    { t: 'gap', h: 10 },
    { t: 'text', text: sh ? `你离边界很近，身上也有一点「${TYPES[sh].name}」的影子。` : `你是比较典型的「${T.name}」。`, size: 30, color: COL.muted, align: 'center' },
    { t: 'gap', h: 30 },
    { t: 'bars', items: [
      { label: '怕失去', right: toPct(r.anx) + '%', value: toPct(r.anx) / 100, hi: r.anx > 0 },
      { label: '怕靠近', right: toPct(r.avo) + '%', value: toPct(r.avo) / 100, hi: r.avo > 0 },
    ]},
    { t: 'divider' },
    { t: 'section', title: '你是这样的', text: T.desc },
    { t: 'list', title: '恋爱里的名场面', items: T.scenes },
    { t: 'section', title: '翻车时刻', text: T.crash },
    { t: 'section', title: '你需要的那个人', text: T.need },
    { t: 'section', title: '和其他体质', text: T.match },
    { t: 'quote', label: '给你的小练习', text: T.practice },
  ];
};

/* 四象限小地图：横轴怕靠近，纵轴怕失去 */
QUIZ.customBlocks = {
  map(ctx, b, y, draw) {
    const S = 600, x0 = CX - S / 2, y0 = y + 52, h = S / 2;
    if (draw) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = F(26, 600); ctx.fillStyle = COL.muted;
      ctx.fillText('↑ 更怕失去', CX, y);
      // 左上向日葵、右上刺猬、左下港湾、右下猫
      [['A', 0, 0], ['F', 1, 0], ['S', 0, 1], ['V', 1, 1]].forEach(([k, cx, cy]) => {
        const on = k === b.key, qx = x0 + cx * h, qy = y0 + cy * h;
        ctx.fillStyle = on ? COL.soft : COL.bg; rr(ctx, qx + 5, qy + 5, h - 10, h - 10, 26); ctx.fill();
        ctx.font = F(32, on ? 800 : 500); ctx.fillStyle = on ? COL.accent : COL.muted;
        ctx.textAlign = cx ? 'right' : 'left'; ctx.textBaseline = cy ? 'bottom' : 'top';
        ctx.fillText(TYPES[k].name, cx ? qx + h - 30 : qx + 30, cy ? qy + h - 28 : qy + 28);
      });
      const dx = x0 + S * b.x, dy = y0 + S * (1 - b.y);
      ctx.fillStyle = 'rgba(0,0,0,.08)'; dot(ctx, dx, dy + 4, 24);
      ctx.fillStyle = COL.accent; dot(ctx, dx, dy, 22);
      ctx.fillStyle = '#fff'; dot(ctx, dx, dy, 9);
      ctx.font = F(26, 600); ctx.fillStyle = COL.muted; ctx.textBaseline = 'top';
      ctx.textAlign = 'left'; ctx.fillText('← 想靠近', x0, y0 + S + 16);
      ctx.textAlign = 'right'; ctx.fillText('要空间 →', x0 + S, y0 + S + 16);
    }
    return y0 + S + 60;
  },
};

QUIZ.copy = r => {
  const T = TYPES[r.key];
  return `我测了「恋爱依恋体质」，我是「${T.name}」（${T.sci}）：${T.tag}。\n\n${T.desc}\n\n翻车时刻：${T.crash}\n你需要的那个人：${T.need}\n给自己的小练习：${T.practice}\n\n怕失去 ${toPct(r.anx)}% ｜ 怕靠近 ${toPct(r.avo)}%`;
};
QUIZ.fileName = r => `依恋体质-${TYPES[r.key].name}.png`;
QUIZ.previews = () => [
  ['S', -9, -7], ['A', 9, -5], ['V', -7, 11], ['F', 7, 1],
].map(([k, anx, avo]) => ({ label: `${TYPES[k].name}（${TYPES[k].sci}）`, result: { key: k, anx, avo } }));


/* ==========================================================
   通用引擎：答题流程、结果卡绘制、保存与复制
   改文案请改上面的数据区，下面一般不需要动
   ========================================================== */
const $ = s => document.querySelector(s);
const COL = QUIZ.colors;
const FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const F = (size, weight) => `${weight || 400} ${size}px ${FONT}`;
const W = 1080, CX = 540, X0 = 140, CW = 800, START = 250;
const NO_LINE_START = '，。！？、；：”’）」』》…,.!?;:)';
const KEYS = 'ABCDEFG';
const state = { answers: [], order: [], idx: 0, locked: false, result: null, img: '' };

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#' + id).classList.add('active');
  window.scrollTo(0, 0);
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
const pct = (v, max) => Math.round(v / max * 100);

/* ---------- 答题 ---------- */
function startQuiz() {
  state.answers = new Array(QUESTIONS.length).fill(null);
  state.order = QUESTIONS.map(q => { const ix = q.opts.map((_, i) => i); return QUIZ.shuffle ? shuffle(ix) : ix; });
  state.idx = 0; state.locked = false;
  show('quiz'); renderQ();
}
function renderQ() {
  const i = state.idx, q = QUESTIONS[i];
  $('#qNum').textContent = `${i + 1}/${QUESTIONS.length}`;
  $('#qBar').style.width = ((i + 1) / QUESTIONS.length * 100) + '%';
  $('#qText').textContent = q.q;
  const box = $('#qOpts'); box.innerHTML = '';
  state.order[i].forEach((oi, pos) => {
    const b = document.createElement('button');
    b.className = 'opt' + (state.answers[i] === oi ? ' sel' : '');
    b.innerHTML = `<span class="k">${KEYS[pos]}</span><span></span>`;
    b.lastChild.textContent = q.opts[oi].t;
    b.addEventListener('click', () => choose(oi, b));
    box.appendChild(b);
  });
  const w = $('#qWrap'); w.classList.remove('anim'); void w.offsetWidth; w.classList.add('anim');
}
/* 防连点：选中后到切题完成之前，其他点击一律忽略 */
function choose(oi, el) {
  if (state.locked) return;
  state.locked = true;
  state.answers[state.idx] = oi;
  document.querySelectorAll('#qOpts .opt').forEach(o => o.classList.remove('sel'));
  el.classList.add('sel');
  setTimeout(() => {
    if (state.idx < QUESTIONS.length - 1) { state.idx++; renderQ(); }
    else finish();
    state.locked = false;
  }, 300);
}
function goBack() {
  if (state.locked) return;
  if (state.idx > 0) { state.idx--; renderQ(); } else show('home');
}
/* 结算前检查漏答：有漏答就跳回那一题 */
function finish() {
  const miss = state.answers.findIndex(a => a == null);
  if (miss >= 0) { state.idx = miss; renderQ(); toast(`第 ${miss + 1} 题还没选，补上再看结果`); return; }
  showResult(QUIZ.score(state.answers));
}
function showResult(r) {
  state.result = r;
  state.img = renderCard(QUIZ.cardHead, QUIZ.blocks(r)).toDataURL('image/png');
  $('#resultImg').src = state.img;
  if (QUIZ.onResult) QUIZ.onResult(r);
  show('result');
}

/* ---------- 结果卡绘制（canvas，宽 1080） ---------- */
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function dot(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
/* 中文逐字换行，标点不放在行首 */
function wrap(ctx, text, maxW) {
  const lines = []; let cur = '';
  for (const ch of text) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    const test = cur + ch;
    if (ctx.measureText(test).width > maxW && cur && !NO_LINE_START.includes(ch)) { lines.push(cur); cur = ch; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function head(ctx, title, y, draw) {
  if (draw) {
    ctx.fillStyle = COL.accent; rr(ctx, X0, y + 6, 8, 34, 4); ctx.fill();
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.font = F(36, 700); ctx.fillStyle = COL.ink; ctx.fillText(title, X0 + 26, y);
  }
  return y + 64;
}

/* 每种区块：先量高度（draw=false），再真正画（draw=true） */
const BLOCK = {
  gap(ctx, b, y) { return y + b.h; },
  divider(ctx, b, y, draw) {
    if (draw) { ctx.fillStyle = COL.line; ctx.fillRect(X0, y + 40, CW, 2); }
    return y + 84;
  },
  text(ctx, b, y, draw) {
    const size = b.size || 34, lh = Math.round(size * (b.lh || 1.75));
    ctx.font = F(size, b.weight || 400);
    const lines = wrap(ctx, b.text, CW);
    if (draw) {
      ctx.fillStyle = b.color || COL.ink; ctx.textBaseline = 'top';
      ctx.textAlign = b.align === 'center' ? 'center' : 'left';
      lines.forEach((l, i) => ctx.fillText(l, b.align === 'center' ? CX : X0, y + i * lh + (lh - size) / 2));
    }
    return y + lines.length * lh;
  },
  big(ctx, b, y, draw) {
    return BLOCK.text(ctx, { text: b.text, size: b.size || 84, weight: 800, color: b.color || COL.accent, align: 'center', lh: 1.3 }, y, draw);
  },
  /* 印章：一个圆里放一个字 */
  seal(ctx, b, y, draw) {
    const R = 104, cy = y + R + 18;
    if (draw) {
      ctx.fillStyle = COL.soft; dot(ctx, CX, cy, R + 18);
      ctx.fillStyle = COL.accent; dot(ctx, CX, cy, R);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = F(b.text.length > 1 ? 72 : 112, 800);
      ctx.fillText(b.text, CX, cy + 4);
    }
    return y + (R + 18) * 2 + 20;
  },
  tags(ctx, b, y, draw) {
    const H = 62, PX = 28, G = 16;
    ctx.font = F(30, 600);
    const rows = [[]]; let w = 0;
    b.items.forEach(it => {
      const iw = ctx.measureText(it).width + PX * 2;
      if (w + iw > CW && rows[rows.length - 1].length) { rows.push([]); w = 0; }
      rows[rows.length - 1].push({ it, iw }); w += iw + G;
    });
    if (draw) rows.forEach((r, ri) => {
      const tw = r.reduce((s, p) => s + p.iw, 0) + G * (r.length - 1);
      let x = CX - tw / 2; const ty = y + ri * (H + G);
      r.forEach(p => {
        ctx.fillStyle = COL.soft; rr(ctx, x, ty, p.iw, H, H / 2); ctx.fill();
        ctx.fillStyle = COL.accent; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.it, x + p.iw / 2, ty + H / 2 + 1);
        x += p.iw + G;
      });
    });
    return y + rows.length * (H + G) - G;
  },
  section(ctx, b, y, draw) {
    y = head(ctx, b.title, y, draw);
    return BLOCK.text(ctx, { text: b.text, size: 32, color: COL.ink2 }, y, draw) + 44;
  },
  list(ctx, b, y, draw) {
    y = head(ctx, b.title, y, draw);
    const lh = 56;
    b.items.forEach(it => {
      ctx.font = F(32);
      const lines = wrap(ctx, it, CW - 40);
      if (draw) {
        ctx.fillStyle = COL.accent; dot(ctx, X0 + 10, y + lh / 2, 6);
        ctx.fillStyle = COL.ink2; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        lines.forEach((l, i) => ctx.fillText(l, X0 + 36, y + i * lh + (lh - 32) / 2));
      }
      y += lines.length * lh + 10;
    });
    return y + 34;
  },
  quote(ctx, b, y, draw) {
    const pad = 44, lh = 58, labelH = b.label ? 52 : 0;
    ctx.font = F(34, 600);
    const lines = wrap(ctx, b.text, CW - pad * 2);
    const H = pad * 2 + labelH + lines.length * lh - 10;
    if (draw) {
      ctx.fillStyle = COL.soft; rr(ctx, X0, y, CW, H, 28); ctx.fill();
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      if (b.label) { ctx.font = F(26, 600); ctx.fillStyle = COL.muted; ctx.fillText(b.label, CX, y + pad - 8); }
      ctx.font = F(34, 600); ctx.fillStyle = COL.accent;
      lines.forEach((l, i) => ctx.fillText(l, CX, y + pad + labelH + i * lh + (lh - 34) / 2 - 6));
    }
    return y + H + 44;
  },
  /* 横向条形：items = [{label, right, value(0~1), hi}] */
  bars(ctx, b, y, draw) {
    if (b.title) y = head(ctx, b.title, y, draw) + 6;
    b.items.forEach(it => {
      if (draw) {
        ctx.textBaseline = 'top'; ctx.textAlign = 'left';
        ctx.font = F(30, it.hi ? 700 : 500); ctx.fillStyle = it.hi ? COL.ink : COL.ink2;
        ctx.fillText(it.label, X0, y);
        ctx.textAlign = 'right'; ctx.fillStyle = it.hi ? COL.accent : COL.muted;
        ctx.fillText(it.right, X0 + CW, y);
        const ty = y + 52;
        ctx.fillStyle = COL.line; rr(ctx, X0, ty, CW, 14, 7); ctx.fill();
        ctx.globalAlpha = it.hi ? 1 : 0.45;
        ctx.fillStyle = COL.accent; rr(ctx, X0, ty, Math.max(14, CW * Math.min(1, it.value)), 14, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      y += 100;
    });
    return y + 10;
  },
  score(ctx, b, y, draw) {
    if (draw) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = COL.muted; ctx.font = F(30, 600); ctx.fillText(b.label, CX, y);
      ctx.fillStyle = COL.accent; ctx.font = F(120, 800); ctx.fillText(b.value + '%', CX, y + 48);
    }
    return y + 48 + 132;
  },
  codebox(ctx, b, y, draw) {
    ctx.font = F(28);
    const hint = wrap(ctx, b.hint, CW - 100);
    const H = 244 + hint.length * 46 + 40;
    if (draw) {
      ctx.fillStyle = COL.bg; rr(ctx, X0, y, CW, H, 28); ctx.fill();
      ctx.setLineDash([12, 10]); ctx.strokeStyle = COL.accent; ctx.lineWidth = 3;
      rr(ctx, X0, y, CW, H, 28); ctx.stroke(); ctx.setLineDash([]);
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = COL.muted; ctx.font = F(30, 600); ctx.fillText(b.label, CX, y + 48);
      ctx.fillStyle = COL.accent; ctx.font = F(100, 800);
      const cs = b.code.split('');
      cs.forEach((ch, i) => ctx.fillText(ch, CX + (i - (cs.length - 1) / 2) * 112, y + 104));
      ctx.fillStyle = COL.muted; ctx.font = F(28);
      hint.forEach((l, i) => ctx.fillText(l, CX, y + 244 + i * 46));
    }
    return y + H;
  },
};
Object.assign(BLOCK, QUIZ.customBlocks || {});

function renderCard(title, blocks) {
  const c = document.createElement('canvas');
  c.width = W; c.height = 10;
  let ctx = c.getContext('2d');
  let y = START;
  for (const b of blocks) y = BLOCK[b.t](ctx, b, y, false);
  const cardBottom = y + 60, H = cardBottom + 150;
  c.height = H; ctx = c.getContext('2d');
  // 背景与顶部色带
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, W, 340);
  g.addColorStop(0, COL.g1); g.addColorStop(1, COL.g2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 340);
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  dot(ctx, 970, 50, 170); dot(ctx, 70, 290, 90);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = F(38, 700); ctx.fillText(title, CX, 80);
  // 白色卡片
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.08)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 8;
  ctx.fillStyle = COL.card; rr(ctx, 80, 170, 920, cardBottom - 170, 40); ctx.fill();
  ctx.restore();
  y = START;
  for (const b of blocks) y = BLOCK[b.t](ctx, b, y, true);
  ctx.fillStyle = COL.muted; ctx.font = F(26); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(QUIZ.footer, CX, cardBottom + 52);
  return c;
}

/* ---------- 保存与复制 ---------- */
/* 保存图片：优先触发下载，不支持时提示长按 */
function saveImg(url, name) {
  try {
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
  toast('如果没有自动保存，长按上面的图片即可保存');
}
/* 复制：剪贴板接口 → execCommand → 弹窗手动复制，三层备用 */
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); toast('已复制'); return; }
  } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (ok) { toast('已复制'); return; }
  $('#manualText').value = t; $('#modal').classList.remove('hidden');
  setTimeout(() => { $('#manualText').focus(); $('#manualText').select(); }, 50);
}

/* ---------- 作者预览：一次性看全部结果卡 ---------- */
function openPreview() {
  const box = $('#pvList'); box.innerHTML = '';
  QUIZ.previews().forEach(p => {
    const d = document.createElement('div'); d.className = 'pv-item';
    const h = document.createElement('h3'); h.textContent = p.label;
    const img = new Image(); img.className = 'result-img';
    img.src = renderCard(QUIZ.cardHead, QUIZ.blocks(p.result)).toDataURL('image/png');
    d.appendChild(h); d.appendChild(img); box.appendChild(d);
  });
  show('preview');
}

function init() {
  $('#kicker').textContent = QUIZ.kicker;
  $('#heroTitle').innerHTML = QUIZ.heroTitle;
  $('#heroDesc').textContent = QUIZ.heroDesc;
  $('#meta').innerHTML = QUIZ.meta.map(([n, l]) => `<span><b>${n}</b>${l}</span>`).join('');
  $('#note').textContent = QUIZ.note;
  $('#startBtn').onclick = startQuiz;
  $('#qBack').onclick = goBack;
  $('#saveBtn').onclick = () => saveImg(state.img, QUIZ.fileName(state.result));
  $('#copyBtn').onclick = () => copyText(QUIZ.copy(state.result));
  $('#againBtn').onclick = startQuiz;
  $('#authorBtn').onclick = openPreview;
  $('#pvBack').onclick = () => show('home');
  $('#modalClose').onclick = () => $('#modal').classList.add('hidden');
  if (QUIZ.init) QUIZ.init();
}
if (typeof document !== 'undefined') init();
