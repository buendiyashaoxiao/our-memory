[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-museum"
version = "0.1.0"
description = "A private, local-first relationship memory museum."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "pillow>=10.0",
  "python-multipart>=0.0.9",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
zh = ["jieba>=0.42"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
memory-museum = "memory_museum.cli:main"

[tool.setuptools.packages.find]
include = ["memory_museum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`",
  "ignore:pkg_resources is deprecated:DeprecationWarning",
]
